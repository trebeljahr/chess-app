name: build-and-deploy

on:
  push:
    branches:
      - main

concurrency:
  group: chess-app-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify authentication and rolling state preservation
        run: pnpm run test:security && pnpm run test:rolling

      - name: Build repo
        run: pnpm run build

      - name: Smoke test built health endpoints
        run: pnpm run smoke:health

  # The web client is Vite's static build served by the Cloudflare Worker
  # chess-app-client (wrangler.jsonc); the zone routes /trpc* to the
  # chess-server app. This job uploads a Worker version and activates
  # nothing: deploy-client switches to it once the server reports this commit.
  build-client:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
    env:
      SITE_URL: https://chess.trebeljahr.com
      WRANGLER: wrangler@4.147.0
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the static client
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: pnpm run build:client && node scripts/prepare-worker-assets.mjs dist/client

      # A Worker version serves only its own files. Carry the last two
      # releases' hashed files so tabs opened before this deploy keep
      # loading their chunks.
      - name: Carry earlier releases' hashed files
        run: node scripts/carry-static.mjs --site "$SITE_URL" --out dist/client --dir assets

      - name: Upload a new Worker version (not live yet)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN/_ACCOUNT_ID are not set — run \`hatchkit cloudflare token --worker chess-app-client\`."
            exit 1
          fi
          pnpm dlx "$WRANGLER" versions upload --tag "$GITHUB_SHA" --message "$GITHUB_SHA"
          id=$(jq -r 'select(.type == "version-upload") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" | head -n 1)
          if [ -z "$id" ]; then
            echo "::error::wrangler reported no version id"
            exit 1
          fi
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
          {
            echo "Uploaded Worker version \`$id\` for $GITHUB_SHA (not live yet)."
            echo "Switch by hand: \`npx --yes $WRANGLER versions deploy $id@100% --name chess-app-client\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-server:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chess-app-server
          tags: |
            type=sha,format=long

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-client, build-server]
    # Keep the existing Compose webhook dormant while the Image resources and
    # shared persistence are prepared. Set this only after cutover.
    if: vars.CHESS_IMAGE_ROLLOUT_READY == 'true'
    outputs:
      server_deployed: ${{ steps.webhook.outputs.server_deployed }}
    steps:
      # Tell Coolify to deploy. There is no Coolify API token here: each
      # app has its own webhook secret (hatchkit mints it), and a `push`
      # payload signed with it queues a deploy of that one app — it can
      # read nothing and touch no other app. The payload names
      # `.hatchkit/deploy-webhook`, the app's only watch path, so an ordinary
      # push that reaches Coolify through its GitHub App never deploys a
      # build that does not exist yet; only this step does.
      #
      # Which apps: COOLIFY_RESOURCE_UUID for a single-app project, or
      # COOLIFY_SERVER_RESOURCE_UUID for the API. The web client is not a
      # Coolify app any more: deploy-client switches its Worker version.
      - name: Deploy via signed Coolify webhook
        id: webhook
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_DEPLOY_SECRET: ${{ secrets.COOLIFY_DEPLOY_SECRET }}
          COOLIFY_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_DEPLOY_REPOSITORY }}
          COOLIFY_DEPLOY_BRANCH: ${{ secrets.COOLIFY_DEPLOY_BRANCH }}
          COOLIFY_SERVER_RESOURCE_UUID: ${{ secrets.COOLIFY_SERVER_RESOURCE_UUID }}
          COOLIFY_SERVER_DEPLOY_SECRET: ${{ secrets.COOLIFY_SERVER_DEPLOY_SECRET }}
          COOLIFY_SERVER_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_SERVER_DEPLOY_REPOSITORY }}
          COOLIFY_SERVER_DEPLOY_BRANCH: ${{ secrets.COOLIFY_SERVER_DEPLOY_BRANCH }}
        if: env.COOLIFY_BASE_URL != ''
        run: |
          set -euo pipefail
          deployed=0
          deploy() { # label, secret-name prefix
            local uuid_var="${2}RESOURCE_UUID" secret_var="${2}DEPLOY_SECRET"
            local repo_var="${2}DEPLOY_REPOSITORY" branch_var="${2}DEPLOY_BRANCH"
            local uuid="${!uuid_var:-}" secret="${!secret_var:-}"
            local repo="${!repo_var:-}" branch="${!branch_var:-}"
            [ -n "$uuid" ] || return 0
            if [ -z "$secret" ] || [ -z "$repo" ] || [ -z "$branch" ]; then
              echo "::error::${2}DEPLOY_SECRET/_REPOSITORY/_BRANCH are not set — run \`hatchkit sync\` or \`hatchkit secrets isolate\`."
              exit 1
            fi
            local body sig answer
            body=$(jq -cn --arg ref "refs/heads/$branch" --arg sha "$GITHUB_SHA" --arg repo "$repo" \
              '{ref: $ref, after: $sha, repository: {full_name: $repo}, commits: [{id: $sha, added: [], removed: [], modified: [".hatchkit/deploy-webhook"]}]}')
            sig=$(printf '%s' "$body" | HOOK_SECRET="$secret" node -e \
              'process.stdout.write(require("node:crypto").createHmac("sha256", process.env.HOOK_SECRET).update(require("node:fs").readFileSync(0)).digest("hex"))')
            answer=$(curl -fsS -X POST "$COOLIFY_BASE_URL/webhooks/source/github/events/manual" \
              -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
              -H "X-Hub-Signature-256: sha256=$sig" --data-binary "$body")
            if printf '%s' "$answer" | jq -e --arg uuid "$uuid" \
              'type == "array" and any(.[]; .application_uuid == $uuid and .status == "success")' \
              >/dev/null 2>&1; then
              echo "deploy queued for the $1 app ($uuid)"
              deployed=$((deployed + 1))
              if [ "$1" = server ]; then echo "server_deployed=true" >> "$GITHUB_OUTPUT"; fi
            else
              # Other apps on the same repo answer "Invalid signature.";
              # they are left out so a public log names only this one.
              detail=$(printf '%s' "$answer" | jq -c '[.[]? | select(.message != "Invalid signature.") | {status, message}]' 2>/dev/null || printf '%s' "$answer" | head -c 200)
              echo "::error::Coolify did not queue a deploy of the $1 app: $detail"
              exit 1
            fi
          }
          deploy app COOLIFY_
          deploy server COOLIFY_SERVER_
          if [ "$deployed" -eq 0 ]; then
            echo "::error::COOLIFY_BASE_URL is set but no COOLIFY_*RESOURCE_UUID is — nothing was deployed."
            exit 1
          fi

  # Server first, then the client: wait until the server reports this
  # commit, switch the Worker in one step, check /version.json. A failure
  # here leaves the new server with the previous client, which is the
  # compatible direction; the run ends red and says so.
  deploy-client:
    runs-on: ubuntu-latest
    needs: [build-client, deploy]
    if: needs.deploy.outputs.server_deployed == 'true'
    env:
      SITE_URL: https://chess.trebeljahr.com
      WRANGLER: wrangler@4.147.0
    steps:
      - name: Wait for the server at this commit
        run: |
          set -uo pipefail
          for i in $(seq 1 40); do
            got=$(curl -fsS --max-time 10 "$SITE_URL/trpc/system.version?cb=$i$RANDOM" 2>/dev/null \
              | jq -r '.result.data.json.commit // empty' 2>/dev/null || true)
            if [ "$got" = "$GITHUB_SHA" ]; then echo "server reports $GITHUB_SHA"; exit 0; fi
            echo "  server: ${got:-<no version>}, waiting ($i/40)"
            sleep 15
          done
          echo "::error::The server never reported $GITHUB_SHA. The client was NOT switched; the previous Worker version still serves."
          exit 1

      - name: Switch the client to this commit's Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ needs.build-client.outputs.version_id }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes "$WRANGLER" versions deploy "$VERSION_ID@100%" --name chess-app-client --message "$GITHUB_SHA" --yes

      - name: Verify the client is live
        run: |
          set -uo pipefail
          for i in $(seq 1 24); do
            commit=$(curl -fsS --max-time 10 "$SITE_URL/version.json?cb=$i$RANDOM" 2>/dev/null \
              | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then echo "$SITE_URL serves $GITHUB_SHA"; exit 0; fi
            echo "  web: ${commit:-<no response>}, waiting ($i/24)"
            sleep 5
          done
          echo "::error::Server $GITHUB_SHA is LIVE, but $SITE_URL/version.json never reported it."
          exit 1
