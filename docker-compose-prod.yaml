# Retained legacy rollback only. The digests are the images observed running
# before the move to Coolify Image apps; never replace them with a moving tag.
# New releases deploy the Image apps by full-SHA digest instead.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    image: ghcr.io/trebeljahr/chess-app-server@sha256:003ac9729064c22aee046581961558238e899eeaa8ddfaa46597704f3cb72d79
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "3514"
      HOST: "0.0.0.0"
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      CHESS_DB_FILE: /app/data/chess.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - chess-data:/app/data

  client:
    image: ghcr.io/trebeljahr/chess-app-client@sha256:05855ec678988ccdb82b5cbff0c9d5b7056b40ec824e5e345d315e098c26609d
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "80"
      BACKEND_URL: http://server:3514
    depends_on:
      - server

volumes:
  chess-data:
