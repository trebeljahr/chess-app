<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Chess</title>
    <meta name="description" content="Play chess against friends online in real time. Create a game, share the link, and enjoy." />
    <link rel="canonical" href="https://chess.trebeljahr.com/" />
    <meta property="og:site_name" content="Online Chess" />
    <meta property="og:title" content="Online Chess" />
    <meta property="og:description" content="Play chess against friends online in real time." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chess.trebeljahr.com/" />
    <meta property="og:image" content="https://chess.trebeljahr.com/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Online Chess wordmark and the line Play chess with a friend in the browser, beside a live game with the board, the match status and the move list" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Online Chess" />
    <meta name="twitter:description" content="Play chess against friends online in real time." />
    <meta name="twitter:image" content="https://chess.trebeljahr.com/og-card.jpg" />
    <meta name="twitter:image:alt" content="Online Chess wordmark and the line Play chess with a friend in the browser, beside a live game with the board, the match status and the move list" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Online Chess",
        "description": "Play chess with a friend in the browser. Share a link, pick a clock, and both boards update live.",
        "url": "https://chess.trebeljahr.com/",
        "image": "https://chess.trebeljahr.com/og-card.jpg",
        "genre": ["Chess", "Board game"],
        "gamePlatform": "Web browser",
        "playMode": "MultiPlayer",
        "numberOfPlayers": { "@type": "QuantitativeValue", "value": 2 },
        "applicationCategory": "Game",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "author": { "@type": "Person", "name": "Rico Trebeljahr", "url": "https://ricos.site" },
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "sameAs": ["https://github.com/trebeljahr/chess-app"]
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var domain = "chess.trebeljahr.com";
        if (location.hostname !== domain) return;
        window.plausible =
          window.plausible ||
          function () {
            (window.plausible.q = window.plausible.q || []).push(arguments);
          };
        var script = document.createElement("script");
        script.defer = true;
        script.dataset.domain = domain;
        script.src =
          "https://plausible.trebeljahr.com/js/script.file-downloads.hash.outbound-links.pageview-props.revenue.tagged-events.js";
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <!-- Static heading for crawlers that read the raw HTML; React's first
         render replaces it. -->
    <div id="root"><h1 class="sr-only">Online Chess</h1></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
